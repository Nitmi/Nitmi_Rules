# NAME: Microsoft_CDN
# AUTHOR: Nitmi
# REPO: https://github.com/Nitmi/Nitmi_Rules

# Microsoft 软件更新与静态内容 CDN 规则
# 仅收录 Microsoft Connected Cache 官方列出的可缓存内容端点
# OneDrive/SharePoint 业务数据交由 Microsoft 策略处理
# SOURCE: https://learn.microsoft.com/windows/deployment/do/delivery-optimization-endpoints
# 请确保此规则优先级高于 Microsoft 规则

payload:
  - "+.windowsupdate.com"
  - "+.dl.delivery.mp.microsoft.com"
  - "+.cdn.office.net"
  - "+.officecdn.microsoft.com"
  - "+.static.microsoft"
